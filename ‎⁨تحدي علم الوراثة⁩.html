<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>تحدي علم الوراثة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: official letterhead band → microscope "field of view" hero → one working column of cards (game, board, teacher). Palette from H&E histology stains on a glass slide. */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --surface-2:#E2EBE7; --ink:#14232A; --muted:#55686B; --line:#C8D5D1;
  --hema:#3A3A8E; --hema-soft:#E4E4F6; --eosin:#BE3A6F; --eosin-soft:#F7E2EB;
  --good:#23845A; --good-soft:#DDF1E6; --bad:#B8392C; --bad-soft:#F7E0DC; --gold:#A97A1F; --gold-soft:#F5EBD3;
  --silver:#7D8A92; --bronze:#A0603A;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D171A; --surface:#15232A; --surface-2:#1C2E35; --ink:#E5EEEB; --muted:#95A8A9; --line:#2A3E45;
  --hema:#A3A2F2; --hema-soft:#26284A; --eosin:#EF84AE; --eosin-soft:#43202F;
  --good:#5ECB91; --good-soft:#163628; --bad:#F2806F; --bad-soft:#40211D; --gold:#E3B75C; --gold-soft:#3A2F18;
  --silver:#B4C0C6; --bronze:#D99369; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D171A; --surface:#15232A; --surface-2:#1C2E35; --ink:#E5EEEB; --muted:#95A8A9; --line:#2A3E45;
  --hema:#A3A2F2; --hema-soft:#26284A; --eosin:#EF84AE; --eosin-soft:#43202F;
  --good:#5ECB91; --good-soft:#163628; --bad:#F2806F; --bad-soft:#40211D; --gold:#E3B75C; --gold-soft:#3A2F18;
  --silver:#B4C0C6; --bronze:#D99369; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* Letterhead */
.letterhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lh-grid{display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:center;gap:10px;padding:14px 16px}
.lh-right{font-weight:600;font-size:.92rem;line-height:1.75}
.lh-center{text-align:center;font-size:.9rem;line-height:1.75}
.lh-center strong{font-family:var(--f-display);font-size:1.02rem;color:var(--hema);font-weight:600}
.lh-left{display:flex;justify-content:flex-end;align-items:center}
.logo-slot{width:96px;height:72px;display:grid;place-items:center;text-align:center;font-size:.72rem;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px;line-height:1.4;padding:4px}
.logo-img{max-height:78px;max-width:120px;object-fit:contain}
.lh-rule{height:5px;background:linear-gradient(90deg,var(--hema) 0 70%,var(--gold) 70% 72%,var(--hema) 72%)}
@media (max-width:560px){.lh-grid{grid-template-columns:1fr 1fr;}.lh-center{grid-column:1/-1;order:3;border-top:1px solid var(--line);padding-top:8px}.lh-right{font-size:.82rem}.logo-slot{width:78px;height:60px}}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:6px 4px}
.lens{width:118px;height:118px;border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 40% 35%,var(--surface) 0,var(--eosin-soft) 70%,var(--hema-soft) 100%);
  box-shadow:0 0 0 7px var(--surface),0 0 0 9px var(--ink),0 0 0 14px var(--surface-2)}
.lens canvas{width:100%;height:100%;border-radius:50%;display:block}
.hero h1{font-size:clamp(1.9rem,6vw,2.9rem);color:var(--hema);font-weight:700;letter-spacing:0}
.hero .sub{font-family:var(--f-display);font-size:1.15rem;color:var(--eosin);font-weight:500}
.hero .lesson{margin-top:4px;color:var(--muted);font-size:.92rem}
@media (max-width:480px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.lens{width:96px;height:96px}}

/* Nav */
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:600;font-size:.92rem}
.tab[aria-current="page"]{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.nav .spacer{flex:1}
.mode{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.mode.on{background:var(--good-soft);color:var(--good)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem}

/* Cards & controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h2{font-size:1.35rem;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:12px;padding:12px 22px;font-weight:700;font-size:1rem;background:var(--hema);color:var(--surface);transition:transform .12s,opacity .12s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.pink{background:var(--eosin)}
.btn.sm{padding:7px 14px;font-size:.88rem;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.92rem}
.input{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;font-size:1.05rem;width:100%}
.input:focus{border-color:var(--hema);outline:none}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--muted)}
.note.warn{background:var(--gold-soft);color:var(--ink)}
.note.ok{background:var(--good-soft);color:var(--ink)}
.err{color:var(--bad);font-weight:600;font-size:.9rem}

/* Rules grid */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rule{background:var(--bg);border-radius:12px;padding:12px;font-size:.88rem}
.rule b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--hema)}
@media (max-width:560px){.rules{grid-template-columns:1fr}}

/* Journey map */
.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:st}
.station{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;min-width:0}
.station .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line)}
.station .ic svg{width:28px;height:28px}
.station h3{font-size:.98rem}
.station .st{font-size:.78rem;color:var(--muted)}
.station.done{border-color:var(--good);background:var(--good-soft)}
.station.done .ic{border-color:var(--good)}
.station.cur{border-color:var(--hema);background:var(--hema-soft)}
.station.cur .ic{border-color:var(--hema)}
.station.locked{opacity:.55}
@media (max-width:640px){.journey{grid-template-columns:1fr 1fr}}
@media (max-width:380px){.journey{grid-template-columns:1fr}}

/* Quiz HUD */
.hud{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.hud .lvname{font-family:var(--f-display);font-weight:600;font-size:1.05rem;min-width:0}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}
.pill.score{color:var(--eosin)}
.progress{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.seg{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.seg i{display:block;height:100%;background:var(--hema);width:0;transition:width .3s}
.seg.done i{background:var(--good)}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--hema-soft);color:var(--hema)}
.chip.sk{background:var(--eosin-soft);color:var(--eosin)}
.qtext{font-size:1.18rem;font-weight:600;line-height:1.8}
.fig{background:var(--bg);border-radius:12px;padding:10px;display:flex;justify-content:center;overflow-x:auto}
.fig svg{max-width:100%;height:auto;display:block}
.opts{display:grid;gap:10px}
.opt{text-align:right;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start;line-height:1.6}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.85rem}
.opt[aria-pressed="true"]{border-color:var(--hema);background:var(--hema-soft)}
.opt[aria-pressed="true"] .k{background:var(--hema);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-weight:700;font-size:1.1rem}
.filltext{font-size:1.12rem;line-height:2.6}
.blank{border:1.5px solid var(--hema);background:var(--hema-soft);border-radius:10px;padding:4px 8px;font-size:1rem;max-width:100%}
.blank.right{border-color:var(--good);background:var(--good-soft)}
.blank.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:.82rem;color:var(--good);font-weight:700;margin-inline-start:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg)}
.mrow .left{font-weight:700}
.mrow select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px}
.mrow.right{background:var(--good-soft)}
.mrow.wrong{background:var(--bad-soft)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}
.olist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.oitem{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px}
.oitem .pos{width:30px;height:30px;border-radius:50%;background:var(--hema);color:var(--surface);display:grid;place-items:center;font-weight:700}
.oitem .mv{display:flex;gap:4px}
.oitem .mv button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.oitem{width:100%;text-align:right;cursor:pointer;min-height:56px}
.oitem.sel{border-color:var(--hema);background:var(--hema-soft)}
.oitem .pos.empty{background:var(--surface-2);color:var(--muted)}
.oitem:disabled{cursor:default}
.oitem.right{border-color:var(--good);background:var(--good-soft)}
.oitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback h3{font-size:1.1rem}
.feedback.ok h3{color:var(--good)}
.feedback.no h3{color:var(--bad)}
.pts{font-weight:700}
.qfoot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

/* Result stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;color:var(--hema);line-height:1.3}
.stat span{font-size:.82rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.big-msg{font-family:var(--f-display);font-size:1.6rem;color:var(--eosin);text-align:center}
.champ{background:linear-gradient(135deg,var(--gold-soft),var(--eosin-soft));border:1.5px solid var(--gold);border-radius:14px;padding:14px;text-align:center;font-family:var(--f-display);font-size:1.25rem;color:var(--gold)}
.certwrap{background:var(--bg);border-radius:12px;padding:10px}
.certwrap canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;direction:ltr;text-align:left;user-select:all}

/* Leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pod{background:var(--bg);border-radius:14px;padding:14px 8px;text-align:center;min-width:0}
.pod .medal{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;font-weight:700;color:var(--surface)}
.pod.p1{padding-block:22px;border:1.5px solid var(--gold);background:var(--gold-soft)}
.pod.p1 .medal{background:var(--gold);width:56px;height:56px}
.pod.p2 .medal{background:var(--silver)}
.pod.p3 .medal{background:var(--bronze)}
.pod .nm{font-weight:700;overflow-wrap:anywhere}
.pod .sc{font-size:.85rem;color:var(--muted)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-weight:700;font-size:.82rem}
tr:last-child td{border-bottom:none}
td.nm{white-space:normal;font-weight:600}
tr.me td{background:var(--hema-soft)}
.badge{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.part{background:var(--gold-soft);color:var(--gold)}

/* Teacher */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 52px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--hema);border-radius:6px}
.bar .fill.low{background:var(--bad)}
.bar .fill.mid{background:var(--gold)}
.hard{display:grid;gap:8px}
.hard li{list-style:none;background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;font-size:.9rem}
.hard ol{margin:0;padding:0}
.hard .rate{font-weight:700;color:var(--bad)}
.sec-title{font-family:var(--f-display);font-size:1.1rem;color:var(--hema)}
.set-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:560px){.set-grid{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center}
.inline-confirm{border:1.5px solid var(--bad);border-radius:12px;padding:12px;background:var(--bad-soft)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app" dir="rtl" lang="ar">
  <header class="letterhead" aria-label="الكليشة الرسمية">
    <div class="lh-grid">
      <div class="lh-right">المملكة العربية السعودية<br>وزارة التعليم<br>المتوسطة الثامنة عشرة</div>
      <div class="lh-center"><strong>مسابقة تفاعلية في مادة العلوم</strong><br>الصف الثالث المتوسط<br>إعداد وتنفيذ: معلمة العلوم منى باعبيد</div>
      <div class="lh-left" id="logoBox"><div class="logo-slot">مكان شعار<br>وزارة التعليم</div></div>
    </div>
    <div class="lh-rule"></div>
  </header>

  <section class="hero">
    <div class="lens"><canvas id="lens" width="240" height="240" aria-hidden="true"></canvas></div>
    <div>
      <h1>تحدي علماء الخلية</h1>
      <div class="sub">رحلة داخل عالم الخلية</div>
      <p class="lesson">الدرس الثاني: علم الوراثة</p>
    </div>
  </section>

  <nav class="nav" id="nav">
    <button class="tab" data-view="home">المسابقة</button>
    <button class="tab" data-view="board">لوحة المتصدرات</button>
    <button class="tab" data-view="teacher" id="tabTeacher" hidden>لوحة المعلمة</button>
    <span class="spacer"></span>
    <span class="mode" id="mode">جارٍ الاتصال…</span>
    <button class="iconbtn" id="soundBtn" aria-pressed="false">الصوت: متوقف</button>
  </nav>

  <main id="main"></main>
</div>

<script>
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');
/* ============ Utilities ============ */
const $=s=>document.querySelector(s);
const AR='٠١٢٣٤٥٦٧٨٩';
const n=x=>String(x).replace(/\d/g,d=>AR[d]);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtT(ms){ms=Math.max(0,Math.round(ms/1000));const m=Math.floor(ms/60),s=ms%60;return n(`${m}:${String(s).padStart(2,'0')}`)}
const tSpan=ms=>`<span class="num" dir="ltr">${fmtT(ms)}</span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
const fmtDate=d=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d))}catch(e){return n(new Date(d).toLocaleDateString())}};
const fmtHijri=d=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d))}catch(e){return ''}};
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

/* ============ Curriculum content (pages 88–98) ============ */
const SK={R:'تذكر',U:'فهم',A:'تطبيق',X:'تحليل واستنتاج'};

(async()=>{
  try{
    if(window.claude&&window.claude.use){
      const r=await Promise.all(['db','user','downloads','assets'].map(k=>window.claude.use(k).catch(()=>null)));

    const t=setTimeout(()=>{if(!boardLoaded){boardLoaded=true;if(view==='board'||view==='teacher')render()}},10000);
    db.collection('board').onSnapshot(q=>{clearTimeout(t);boardLoaded=true;BOARD=q.docs.map(d=>({id:d.id,...d.data()}));if(view==='board'||view==='teacher'||view==='home')render();else if(view==='final'&&S&&S.saved==='ok')renderFinal()},()=>{clearTimeout(t);boardLoaded=true});
    if(isOwner)db.collection('details').onSnapshot(q=>{DETAILS={};q.docs.forEach(d=>DETAILS[d.id]=d.data());if(view==='teacher')render()},()=>{});

function applyLogo(){const b=$('#logoBox');if(CFG.logo){b.innerHTML=`<img class="logo-img" src="${esc(CFG.logo)}" alt="شعار وزارة التعليم">`}else{b.innerHTML='<div class="logo-slot">مكان شعار<br>وزارة التعليم</div>'}}

/* ============ Sound & effects ============ */
let actx=null;
function beep(kind){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const seq={ok:[[660,.09],[880,.14]],no:[[220,.18]],win:[[523,.12],[659,.12],[784,.12],[1047,.3]],lvl:[[587,.1],[784,.18]]}[kind];let t=actx.currentTime;for(const [f,d] of seq){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.9}}catch(e){}}
function syncSoundBtn(){const b=$('#soundBtn');b.textContent=sound?'الصوت: مفعّل':'الصوت: متوقف';b.setAttribute('aria-pressed',String(sound))}
$('#soundBtn').onclick=()=>{sound=!sound;LS.set('cc_sound',sound);syncSoundBtn();beep('ok')};syncSoundBtn();
const RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false;
function burst(count,spread){if(RM)return;const W=fx.width=innerWidth*devicePixelRatio,H=fx.height=innerHeight*devicePixelRatio;const cs=getComputedStyle(document.documentElement);const cols=['--eosin','--hema','--gold','--good'].map(v=>cs.getPropertyValue(v).trim());for(let i=0;i<count;i++)parts.push({x:W/2+(Math.random()-.5)*W*spread,y:H*(spread>.5?-.05:.45),vx:(Math.random()-.5)*14*devicePixelRatio,vy:(spread>.5?Math.random()*4:-Math.random()*14-4)*devicePixelRatio,r:(3+Math.random()*5)*devicePixelRatio,c:cols[i%4],life:120+Math.random()*60,round:Math.random()<.5});if(!fxRun){fxRun=true;requestAnimationFrame(tick)}}
function tick(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0&&p.y<fx.height+40);for(const p of parts){p.vy+=.35*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.life--;fctx.fillStyle=p.c;fctx.beginPath();if(p.round)fctx.arc(p.x,p.y,p.r,0,7);else fctx.rect(p.x,p.y,p.r*1.6,p.r);fctx.fill()}if(parts.length)requestAnimationFrame(tick);else{fxRun=false;fctx.clearRect(0,0,fx.width,fx.height)}}
/* Microscope lens ambience */
(function(){const c=$('#lens'),x=c.getContext('2d');const cells=Array.from({length:9},(_,i)=>({x:Math.random()*240,y:Math.random()*240,r:18+Math.random()*22,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,p:Math.random()*6}));
function draw(){const cs=getComputedStyle(document.documentElement);const h=cs.getPropertyValue('--hema').trim(),e=cs.getPropertyValue('--eosin').trim();x.clearRect(0,0,240,240);for(const k of cells){if(!RM){k.x+=k.vx;k.y+=k.vy;k.p+=.01;if(k.x<-40)k.x=280;if(k.x>280)k.x=-40;if(k.y<-40)k.y=280;if(k.y>280)k.y=-40}x.globalAlpha=.55;x.strokeStyle=e;x.lineWidth=2.5;x.beginPath();for(let a=0;a<=6.3;a+=.2){const rr=k.r*(1+.06*Math.sin(a*3+k.p));const px=k.x+rr*Math.cos(a),py=k.y+rr*Math.sin(a);a?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke();x.globalAlpha=.8;x.fillStyle=h;x.beginPath();x.arc(k.x+k.r*.15,k.y-k.r*.1,k.r*.28,0,7);x.fill()}x.globalAlpha=1;if(!RM)requestAnimationFrame(draw)}draw()})();

function render(){setTabs();const m=$('#main');

function myEntry(){if(online()){const d=BOARD.find(b=>b.id===uid);return d&&d.entries&&d.entries[CFG.round]}const L=LS.get('cc_local',[]);return L.filter(e=>e.round===CFG.round&&e.done).sort(cmp)[0]}

      <div class="rule"><b>+١٠</b>لكل إجابة صحيحة</div>

      <div class="rule"><b>−٣</b>لكل إجابة خاطئة. اجتياز المستوى يتطلب ٦٠٪ من إجاباته صحيحة</div>
    </div>

    <form id="startForm" class="stack" novalidate>
      <div class="field"><label for="nameIn">اسم الطالبة الثلاثي</label>
      <input class="input" id="nameIn" maxlength="40" autocomplete="name" placeholder="مثال: نورة عبدالله القحطاني" value="${esc(prev)}"></div>
      <div class="err" id="nameErr" hidden></div>
      <div class="row"><button class="btn" type="submit" id="startBtn">ابدئي التحدي</button>
      <span class="small muted">إعادة المحاولة لكل مستوى: ${CFG.retries<0?'بلا حد':CFG.retries===0?'غير متاحة':n(CFG.retries)+' مرة'}</span></div>
    </form>`}
    ${capsReady&&!online()?`<div class="note">هذه الصفحة تعمل الآن في <b>وضع الجهاز الواحد</b>: ستظهر نتيجتك على هذا الجهاز، وستحصلين في النهاية على <b>رمز نتيجة</b> ترسلينه للمعلمة لتضيفه إلى السجل.</div>`:''}
  </section>
  <section class="card stack"><h2>محطات الرحلة</h2>${journeyHTML(0,0)}</section></div>`}
function bindHome(){const f=$('#startForm');if(!f)return;f.onsubmit=e=>{e.preventDefault();const v=$('#nameIn').value.trim().replace(/\s+/g,' ');const er=$('#nameErr');
  if(v.length<3||!/^[؀-ۿa-zA-Z\s.'-]+$/.test(v)){er.textContent='اكتبي اسمك بالحروف (ثلاثة أحرف على الأقل).';er.hidden=false;return}

/* ============ Game engine ============ */

  <div class="head"><div>المملكة العربية السعودية<br>وزارة التعليم<br>المتوسطة الثامنة عشرة</div><div style="text-align:center">مسابقة تفاعلية في مادة العلوم<br>الصف الثالث المتوسط<br>معلمة العلوم: منى باعبيد</div><div style="text-align:left">${fmtHijri(Date.now())}<br>${fmtDate(Date.now())} م</div></div>
  <h1>تقرير نتائج «تحدي علماء الخلية» – علم الوراثة — ${esc(r.label||'')}</h1>
  <div class="kpi"><div><b>${n(list.length)}</b>المشاركات</div><div><b>${n(list.filter(e=>e.done).length)}</b>أكملن</div><div><b>${n(avg)}</b>متوسط الدرجات من ${n(MAXPTS)}</div><div><b>${list[0]?esc(list[0].name):'—'}</b>المتصدرة</div></div>
  <h2>ترتيب الطالبات</h2><table><tr><th>م</th><th>الاسم</th><th>الدرجة</th><th>صحيحة</th><th>خاطئة</th><th>الزمن</th><th>الحالة</th><th>التقدير</th></tr>${list.map((e,i)=>`<tr><td>${n(i+1)}</td><td>${esc(e.name)}</td><td>${n(e.score)}</td><td>${n(e.correct)}</td><td>${n(e.wrong)}</td><td dir="ltr" style="text-align:right">${fmtT(e.timeMs)}</td><td>${e.done?'مكتملة':'غير مكتملة'}</td><td>${e.grade||''}</td></tr>`).join('')}</table>
  <h2>الأداء حسب المهارة</h2><table><tr><th>المهارة</th><th>نسبة الإجابات الصحيحة</th></tr>${Object.keys(SK).map(k=>`<tr><td>${SK[k]}</td><td>${A.sk[k].n?n(Math.round(A.sk[k].c/A.sk[k].n*100))+'٪':'—'}</td></tr>`).join('')}</table>
  <h2>الأداء حسب المستوى</h2><table><tr><th>المستوى</th><th>الموضوع</th><th>نسبة الإجابات الصحيحة</th></tr>${LEVELS.map((L,i)=>`<tr><td>${n(i+1)}. ${L.name}</td><td>${esc(L.topic)}</td><td>${A.lv[i].n?n(Math.round(A.lv[i].c/A.lv[i].n*100))+'٪':'—'}</td></tr>`).join('')}</table>
  <h2>الأسئلة الأكثر إخفاقًا</h2><table><tr><th>السؤال</th><th>المهارة</th><th>نسبة الخطأ</th></tr>${hard.map(h=>`<tr><td>${esc(h.q.q.replace(/___/g,'…'))}</td><td>${SK[h.q.sk]}</td><td>${n(Math.round(h.w/h.n*100))}٪</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات كافية</td></tr>'}</table>
